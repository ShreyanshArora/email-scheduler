name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy the exact main commit through AWS Systems Manager
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "$AWS_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$AWS_INSTANCE_ID" \
            --comment "Outbox release $GITHUB_SHA" \
            --parameters "{\"commands\":[\"cd /home/ubuntu/outbox-sde- && sudo -u ubuntu bash -c 'git fetch origin main && git show $GITHUB_SHA:deploy/release.sh | bash -s -- $GITHUB_SHA'\"]}" \
            --query Command.CommandId --output text)
          for attempt in $(seq 1 150); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                exit 1 ;;
            esac
            sleep 10
          done
          echo 'Deployment did not finish within 25 minutes'
          exit 1
