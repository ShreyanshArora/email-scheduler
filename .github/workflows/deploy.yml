name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy verified main revision
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/outbox-sde-' }}
        run: |
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" "cd '$DEPLOY_PATH' && bash deploy/release.sh '$GITHUB_SHA'"
      - name: Remove temporary credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
