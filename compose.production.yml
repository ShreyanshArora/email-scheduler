services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [elastic_data:/usr/share/elasticsearch/data]
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: api
    env_file: ${APP_ENV_FILE:-.env.production}
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://reachinbox:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/reachinbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WEB_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      GOOGLE_CALLBACK_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/auth/google/callback
      SLACK_CALLBACK_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/auth/slack/callback
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: api
    env_file: ${APP_ENV_FILE:-.env.production}
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
  worker:
    build:
      context: .
      target: api
    env_file: ${APP_ENV_FILE:-.env.production}
    environment: *api-env
    command: ["node", "dist/worker.js"]
    stop_grace_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    profiles: [https]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  elastic_data:
